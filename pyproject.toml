[project]
name = "dev-ready"
version = "0.12.0"
description = "Scaffold AI-development-ready FastAPI projects with canonical agent guidance, Agent Targets, MCP config, and design docs"
readme = "README-pypi.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "copier>=9.4,<10",
    "questionary>=2.1,<3",
]

[project.scripts]
dev-ready = "dev_ready.cli:main"

[dependency-groups]
dev = [
    # Drives QuestionaryAsker headlessly in tests (pipe input + dummy output).
    # questionary pulls it in anyway, but far too loosely (>=2.0,<4.0) to rely on.
    "prompt-toolkit>=3.0.29,<4",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
# Pinned: hatchling 1.32.0 (2026-08-11) emits Metadata-Version 2.5, which the
# twine inside pypa/gh-action-pypi-publish@v1.14.1 rejects as invalid, failing
# the release before upload. 1.31.0 emits 2.4 and is what shipped v0.10.0.
# Unpin only together with a publish action whose twine accepts 2.5.
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_ready"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/dev_ready/templates"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: marks tests that require real network access (deselected by default)",
]

